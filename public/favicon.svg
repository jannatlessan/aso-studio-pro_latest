<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121815" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#030504" />
    </linearGradient>

    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#0E9D52" />
      <stop offset="100%" stop-color="#006622" />
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Theme Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#0E9D52" stroke-opacity="0.35" stroke-width="12" />

  <!-- Styled "S" Monogram -->
  <g filter="url(#emeraldGlow)">
    <path 
      d="M360 215 C360 150, 310 110, 248 110 C170 110, 142 165, 142 210 C142 295, 360 260, 360 338 C360 395, 305 418, 240 418 C160 418, 136 360, 136 312" 
      fill="none" 
      stroke="url(#sGrad)" 
      stroke-width="58" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Glowing Active Status Dot -->
  <circle cx="410" cy="102" r="30" fill="#34D399" stroke="#08080A" stroke-width="12" />
</svg>