    <!-- Google tag (gtag.js) -->
    <script>
      // gtag.js loads on the first user interaction, or 5 s after the load event (when idle),
      // so it never competes with loading; dataLayer queues the calls below until it arrives.
      (function () {
        var done = false;
        var evs = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        function load() {
          if (done) return;
          done = true;
          evs.forEach(function (e) { removeEventListener(e, load, true); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-T911X372DP';
          document.head.appendChild(s);
        }
        evs.forEach(function (e) { addEventListener(e, load, { capture: true, passive: true, once: true }); });
        addEventListener('load', function () {
          setTimeout(function () {
            if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 3000 }); else load();
          }, 5000);
        });
      })();
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-T911X372DP');
    </script>

    <script>
      // Safeguard against libraries attempting to overwrite the read-only window.fetch property
      (function() {
        const nativeFetch = window.fetch;
        if (nativeFetch) {
          Object.defineProperty(window, 'fetch', {
            enumerable: true,
            configurable: true,
            get: function() { return nativeFetch; },
            set: function() { 
              console.warn('A library attempted to overwrite window.fetch. This was prevented to avoid a TypeError.');
            }
          });
        }
      })();
    </script>
    <script>
      // Restore deep-link paths redirected by static-host 404 fallback.
      (function(l) {
        if (l.search[1] === '/') {
          const decoded = l.search
            .slice(1)
            .split('&')
            .map(function(s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');

          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
